 try{const em=newEmail(p),uid=await mkUser(em,w),b=db.batch();b.set(col('users').doc(uid),{mid:id,ext:true});b.set(col('phones').doc(p),{e:em});b.update(col('outsiders').doc(id),{email:em,uid,phone:p});if(o.uid)b.delete(col('users').doc(o.uid));await b.commit();toast('একাউন্ট প্রস্তুত হয়েছে')}catch(e){err(e)}}
async function delO(id){if(!ask('o'+id))return;const o=memb(id),b=db.batch();b.delete(col('outsiders').doc(id));if(o.uid)b.delete(col('users').doc(o.uid));if(o.phone)b.delete(col('phones').doc(o.phone));S.loans.filter(l=>l.mid==id).forEach(l=>b.delete(col('loans').doc(l.id)));S.chat.filter(c=>c.mid==id).forEach(c=>b.delete(col('chat').doc(c.id)));try{await b.commit()}catch(e){err(e)}}
function notiv(){return`<div class="card"><h2>নতুন নোটিফিকেশন</h2><input id="nt" placeholder="শিরোনাম" style="width:100%;margin-bottom:8px"><textarea id="nm" rows="3" placeholder="বার্তা" style="width:100%;margin-bottom:8px"></textarea><div class="row"><select id="nto"><option value="all">সব সদস্য</option><option value="allx">সব বাইরের ঋণগ্রহীতা</option>${opts()}${oopts()}</select><label class="row" style="flex:none"><input type="checkbox" id="npop" style="width:20px;height:20px;flex:none"> পপ-আপ হিসেবে দেখাবে</label><button class="btn" onclick="addN()">পাঠান</button></div><small class="mu">পপ-আপ: সদস্য অ্যাপ খুললেই পর্দায় ভেসে উঠবে, "ঠিক আছে" না চাপা পর্যন্ত থাকবে। সাধারণ: সদস্যের 🔔 নোটিফিকেশন ট্যাবে জমা হবে।</small></div>
 <div class="card"><h2>পাঠানো নোটিফিকেশন</h2>${[...S.notices].sort((a,b)=>b.ts.localeCompare(a.ts)).map(n=>`<div class="tx"><span class="ic in">${n.popup?'📣':'🔔'}</span><div style="flex:1"><b>${esc(n.title)}</b><br><span class="mu">${esc(n.text)}</span><br><small class="mu">${n.mid==='all'?'সব সদস্য':n.mid==='allx'?'সব বাইরের ঋণগ্রহীতা':esc(memb(n.mid).name)} · ${fd(n.ts.slice(0,10))}${n.popup?' · পপ-আপ':''}</small></div>${del('n'+n.id,`delN('${n.id}')`)}</div>`).join('')||'<p class="mu">কিছু পাঠানো হয়নি</p>'}</div>`}
function addN(){const t=v('nt'),x=v('nm');if(!t||!x)return toast('শিরোনাম ও বার্তা লিখুন');col('notices').add({title:t,text:x,mid:v('nto'),popup:$('npop').checked,ts:new Date().toISOString()}).then(()=>{toast('নোটিফিকেশন পাঠানো হয়েছে');$('nt').value='';$('nm').value=''}).catch(err)}
function delN(id){if(!ask('n'+id))return;col('notices').doc(id).delete().catch(err)}
function ledv(){const f=S.ledger.filter(x=>!lf||x.date.startsWith(lf)),sm=(z,t)=>z.filter(x=>x.type===t).reduce((a,x)=>a+x.amt,0),inc=sm(f,'in'),exp=sm(f,'out'),mo={};
 S.ledger.forEach(x=>{const b=mo[x.date.slice(0,7)]=mo[x.date.slice(0,7)]||{i:0,o:0};x.type==='in'?b.i+=x.amt:b.o+=x.amt});
 return`<div class="card"><h2>আয়-ব্যয় লিখুন</h2><div class="row"><select id="lty"><option value="in">➕ আয়</option><option value="out">➖ ব্যয়</option></select><input id="lc" list="cats" placeholder="খাত (যেমন: অনুদান, ভাড়া)"><datalist id="cats">${['সার্ভিস চার্জ','অনুদান/দান','সদস্য ফি','জরিমানা আদায়','ভাড়া','আপ্যায়ন','যাতায়াত','প্রিন্ট/খাতা','সহায়তা প্রদান','অন্যান্য'].map(c=>`<option value="${c}">`).join('')}</datalist><input id="lamt" type="number" placeholder="টাকা ৳" min="1"></div><div class="row" style="margin-top:8px"><label class="lb">তারিখ<input id="ldt" type="date" value="${today()}"></label><input id="lnote" placeholder="বিবরণ (ঐচ্ছিক)"><button class="btn" onclick="addLed()">সংরক্ষণ</button></div></div>
 <div class="grid"><div class="stat"><small>আয়${lf?' ('+fm(lf)+')':''}</small><b>${tk(inc)}</b></div><div class="stat w"><small>ব্যয়</small><b>${tk(exp)}</b></div><div class="stat hi"><small>নিট আয়</small><b>${tk(inc-exp)}</b></div></div>
 <div class="card"><div class="row" style="justify-content:space-between"><h2 style="margin:0">হিসাবের খাতা</h2><span class="row"><input type="month" id="lfm" value="${lf}" onchange="lf=this.value;render()" style="flex:none"><button class="btn s g" onclick="lf='';render()">সব</button><button class="btn s g" onclick="expLed()">CSV</button></span></div><div class="tw"><table><tr><th>তারিখ</th><th>ধরন</th><th>খাত</th><th>বিবরণ</th><th>টাকা</th><th></th></tr>${[...f].sort((x,y)=>y.date.localeCompare(x.date)).map(x=>`<tr><td>${fd(x.date)}</td><td><span class="pill" style="${x.type==='out'?'background:#c0392b22;color:var(--rd)':''}">${x.type==='in'?'আয়':'ব্যয়'}</span></td><td>${esc(x.cat)}</td><td>${esc(x.note||'')}</td><td><b class="${x.type==='in'?'in':'out'}">${x.type==='in'?'+':'−'} ${tk(x.amt)}</b></td><td>${del('g'+x.id,`delLed('${x.id}')`)}</td></tr>`).join('')||'<tr><td colspan=6 class="mu">কিছু নেই</td></tr>'}</table></div></div>
 ${Object.keys(mo).length?`<div class="card"><h2>মাসভিত্তিক সারাংশ</h2><div class="tw"><table><tr><th>মাস</th><th>আয়</th><th>ব্যয়</th><th>নিট</th></tr>${Object.keys(mo).sort().reverse().map(k=>`<tr><td>${fm(k)}</td><td>${tk(mo[k].i)}</td><td>${tk(mo[k].o)}</td><td><b>${tk(mo[k].i-mo[k].o)}</b></td></tr>`).join('')}</table></div></div>`:''}`}
function addLed(){const am=+v('lamt'),c=v('lc');if(!am||!c)return toast('খাত ও টাকা লিখুন');col('ledger').add({type:v('lty'),cat:c,amt:am,date:v('ldt')||today(),note:v('lnote')}).then(()=>{toast('সংরক্ষিত');$('lamt').value='';$('lnote').value=''}).catch(err)}
function delLed(id){if(!ask('g'+id))return;col('ledger').doc(id).delete().catch(err)}
function expLed(){csv('income-expense.csv',[['তারিখ','ধরন','খাত','বিবরণ','টাকা'],...S.ledger.map(x=>[x.date,x.type==='in'?'আয়':'ব্যয়',x.cat,x.note||'',x.amt])])}
const sec=()=>firebase.apps.find(x=>x.name==='sec')||firebase.initializeApp(CFG,'sec');
async function mkUser(email,pw){const x=sec().auth();const c=await x.createUserWithEmailAndPassword(email,PW(pw));await x.signOut();return c.user.uid}
const newEmail=p=>p+'-'+Date.now().toString(36)+DOM;
function saveSet(){col('settings').doc('main').set({org:v('on'),about:v('ab'),contact:v('ct'),ad:v('al'),hHtml:$('hh').value,mHtml:$('mh').value},{merge:true}).then(()=>toast('সংরক্ষিত হয়েছে')).catch(err)}
async function addMem(){const n=v('mn'),p=normP(v('mp')),w=E(v('mw')),no=+E(v('mno'))||Math.max(0,...S.members.map(m=>m.no||0))+1;if(!n||!p||!w)return toast('সব ঘর পূরণ করুন');if(w.length<4)return toast('পাসওয়ার্ড কমপক্ষে ৪ অক্ষর দিন');if(dupPhone(p))return toast('এই নাম্বার আগেই আছে');
 try{const em=newEmail(p),uid=await mkUser(em,w),r=col('members').doc(),b=db.batch();b.set(r,{name:n,phone:p,no,joined:today(),email:em,uid});b.set(col('users').doc(uid),{mid:r.id});b.set(col('phones').doc(p),{e:em});await b.commit();['mn','mp','mw','mno'].forEach(i=>$(i)&&($(i).value=''));toast('সদস্য যোগ হয়েছে')}catch(e){err(e)}}
async function resetP(id){const w=E(v('rp'+id)),m=memb(id);if(w.length<4)return toast('নতুন পাসওয়ার্ড (কমপক্ষে ৪ অক্ষর) লিখুন');
 try{const em=newEmail(m.phone),uid=await mkUser(em,w),b=db.batch();b.set(col('users').doc(uid),{mid:id});b.set(col('phones').doc(m.phone),{e:em});b.update(col('members').doc(id),{email:em,uid});if(m.uid)b.delete(col('users').doc(m.uid));await b.commit();toast('পাসওয়ার্ড বদলেছে')}catch(e){err(e)}}
async function delM(id){if(!ask('m'+id))return;const m=memb(id),b=db.batch();b.delete(col('members').doc(id));if(m.uid)b.delete(col('users').doc(m.uid));if(m.phone)b.delete(col('phones').doc(m.phone));['deposits','loans','chat'].forEach(k=>S[k].filter(x=>x.mid==id).forEach(x=>b.delete(col(k).doc(x.id))));try{await b.commit()}catch(e){err(e)}}
function addD(){const a=+v('da')||0,y=+v('dy')||0,f=+v('df')||0;if(!S.members.length)return;if(!a&&!y)return toast('মাসিক জমা বা বাৎসরিক টাকা লিখুন');col('deposits').add({mid:v('dm'),month:v('dmo'),amt:a,annual:y,fine:f,date:v('dd')||today()}).then(()=>{toast('জমা সংরক্ষিত');['da','dy','df'].forEach(i=>$(i)&&($(i).value=''))}).catch(err)}
function delD(id){if(!ask('d'+id))return;col('deposits').doc(id).delete().catch(err)}
function addL(){const a=+v('la'),p=+v('lp')||0,i=+v('li'),P=Math.round(a*(1+p/100));if(!$('lm').value||!a)return toast('ঋণের পরিমাণ লিখুন');if(!i)return toast('কিস্তির পরিমাণ লিখুন');col('loans').add({mid:v('lm'),amt:a,pay:P,inst:i,n:Math.ceil(P/i),start:v('ls'),date:v('ld')||today(),gn:v('gn'),gp:normP(v('gp')),note:'',paid:[],ext:tab==='ext'}).then(()=>toast('ঋণ সংরক্ষিত')).catch(err)}
function pay(id){const l=S.loans.find(x=>x.id==id),s=sched(l).find(x=>!x.paid);if(!s)return;col('loans').doc(id).update({paid:[...l.paid,{m:s.m,amt:+v('pa'+id)||s.a,date:v('pd'+id)||today()}]}).then(()=>toast('কিস্তি জমা হয়েছে')).catch(err)}
function delL(id){if(!ask('l'+id))return;col('loans').doc(id).delete().catch(err)}
function chA(){const w=E(v('ap'));if(w.length<4)return toast('কমপক্ষে ৪ অক্ষর দিন');auth.currentUser.updatePassword(PW(w)).then(()=>toast('পাসওয়ার্ড বদলেছে')).catch(e=>toast(e.code==='auth/requires-recent-login'?'লগআউট করে আবার ঢুকে চেষ্টা করুন':authErr(e)))}
async function login(){const w=E(v('lw'));if(!w)return toast('পাসওয়ার্ড দিন');try{await auth.signInWithEmailAndPassword(AEMAIL,PW(w))}catch(e){toast(authErr(e))}}
async function setup(){const w=E(v('lw'));if(w.length<4)return toast('কমপক্ষে ৪ অক্ষরের পাসওয়ার্ড লিখে তারপর চাপুন');
 try{await auth.createUserWithEmailAndPassword(AEMAIL,PW(w));await col('settings').doc('main').set({org:S.org,about:S.about,contact:S.contact,ad:'',hHtml:'',mHtml:''},{merge:true})}catch(e){toast(e.code==='auth/email-already-in-use'?'অ্যাডমিন একাউন্ট আগেই আছে, পাসওয়ার্ড দিয়ে প্রবেশ করুন':authErr(e))}}
auth.onAuthStateChanged(u=>{
 if(u&&u.email===AEMAIL){if(!ok){ok=1;['members','deposits','loans','chat','notices','ledger','outsiders'].forEach(n=>listen(n,col(n),onData))}render()}
 else{if(u)auth.signOut();ok=0;unlisten();render()}});
listenSettings();render();
